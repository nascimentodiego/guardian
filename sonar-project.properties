# ─────────────────────────────────────────────
# SonarQube Cloud — guardian Android project
# ─────────────────────────────────────────────

sonar.projectKey=nascimentodiego_guardian
sonar.organization=nascimentodiego
sonar.host.url=https://sonarcloud.io

# ── Fontes ────────────────────────────────────
sonar.sources=.
sonar.java.source=17

# ── Exclusões de análise ──────────────────────
sonar.exclusions=\
  **/build/**,\
  **/*.generated.*,\
  **/R.class,\
  **/R$*.class,\
  **/BuildConfig.*,\
  **/Manifest*.*,\
  **/*_Hilt*.class,\
  **/*Dagger*.class,\
  **/*_Factory*.class,\
  **/*_MembersInjector*.class,\
  **/*Module_Provide*.class,\
  **/*Component*.class,\
  **/databinding/**,\
  **/di/module/**,\
  **/build-logic/**

# ── Exclusões de cobertura ────────────────────
sonar.coverage.exclusions=\
  **/R.class,\
  **/R$*.class,\
  **/BuildConfig.*,\
  **/Manifest*.*,\
  **/*_Hilt*,\
  **/*Dagger*,\
  **/*_Factory*,\
  **/*_MembersInjector*,\
  **/*Module_Provide*,\
  **/*Component*,\
  **/databinding/**,\
  **/di/module/**,\
  **/test/**,\
  **/androidTest/**,\
  **/build-logic/**

# ── Relatórios JaCoCo (por módulo, via wildcard) ──
# Gerado em: build/reports/coverage/jacoco/{flavor}/{buildType}.xml
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/coverage/jacoco/**/*.xml

# ── Relatórios de testes unitários ───────────
sonar.junit.reportPaths=**/build/test-results/**/TEST-*.xml

# ── Duplicações — ignorar código gerado ──────
sonar.cpd.exclusions=\
  **/databinding/**,\
  **/*Binding.*,\
  **/build-logic/**

# ── Quality Gate ──────────────────────────────
# Aguarda o resultado do Quality Gate para falhar o CI se necessário
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300