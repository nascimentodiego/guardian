name: PR Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  checks:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**'
          retention-days: 7

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7

      - name: Build
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Validate Screenshot Tests
        id: screenshot_validation
        run: ./gradlew validateDebugScreenshotTest
        continue-on-error: true

      - name: Upload screenshot diffs
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/reports/screenshotTest/**'
          retention-days: 7

      - name: Comment PR on screenshot failure
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ Screenshot Tests Failed',
                '',
                'As screenshots divergem das referências salvas. Baixe os diffs para visualizar as diferenças:',
                '',
                `**[📎 Download screenshot diffs](${runUrl})**`,
                '',
                'Para atualizar as referências localmente:',
                '```',
                './gradlew updateDebugScreenshotTest',
                '```',
              ].join('\n')
            });

      - name: Fail build on screenshot changes
        if: steps.screenshot_validation.outcome == 'failure'
        run: exit 1
