name: PR Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  checks:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run ktlint
        id: ktlint
        run: ./gradlew ktlintCheck
        continue-on-error: true

      - name: Upload ktlint reports
        if: steps.ktlint.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**'
          retention-days: 7

      - name: Run detekt
        id: detekt
        run: ./gradlew detekt
        continue-on-error: true

      - name: Upload detekt reports
        if: steps.detekt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7

      - name: Build
        id: build
        run: ./gradlew assembleDebug
        continue-on-error: true

      - name: Run Unit Tests
        id: unit_tests
        run: ./gradlew test
        continue-on-error: true

      - name: Validate Screenshot Tests
        id: screenshot_validation
        run: ./gradlew validateDebugScreenshotTest
        continue-on-error: true

      - name: Upload screenshot diffs
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/reports/screenshotTest/**'
          retention-days: 7

      - name: Post PR Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-checks-summary -->';

            const icon = o => ({ success: '✅', failure: '❌', skipped: '⏭️' }[o] ?? '⚠️');

            const steps = [
              ['KtLint',           '${{ steps.ktlint.outcome }}'],
              ['Detekt',           '${{ steps.detekt.outcome }}'],
              ['Build',            '${{ steps.build.outcome }}'],
              ['Unit Tests',       '${{ steps.unit_tests.outcome }}'],
              ['Screenshot Tests', '${{ steps.screenshot_validation.outcome }}'],
            ];

            const rows = steps
              .map(([name, outcome]) => `| ${icon(outcome)} | ${name} | \`${outcome}\` |`)
              .join('\n');

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const screenshotSection = '${{ steps.screenshot_validation.outcome }}' === 'failure'
              ? [
                  '',
                  '### Screenshot Diffs',
                  `Baixe os diffs em **[📎 Artifacts](${runUrl})**`,
                  '',
                  'Para atualizar as referências localmente:',
                  '```',
                  './gradlew updateDebugScreenshotTest',
                  '```',
                ].join('\n')
              : '';

            const body = [
              marker,
              '## 📋 PR Checks Summary',
              '',
              '| | Step | Status |',
              '|---|---|---|',
              rows,
              screenshotSection,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if any step failed
        if: always()
        run: |
          if [[ "${{ steps.ktlint.outcome }}"            == "failure" || \
                "${{ steps.detekt.outcome }}"            == "failure" || \
                "${{ steps.build.outcome }}"             == "failure" || \
                "${{ steps.unit_tests.outcome }}"        == "failure" || \
                "${{ steps.screenshot_validation.outcome }}" == "failure" ]]; then
            exit 1
          fi
