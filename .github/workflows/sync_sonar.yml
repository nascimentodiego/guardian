name: Sonar Analysis on Main Branches

# Runs SonarQube analysis on develop and main branches.
# Triggered on push (after PR merge) or manually via workflow_dispatch.
# Keeps the Sonar dashboard up-to-date without needing to run the full PR pipeline.

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      # fetch-depth: 0 is required — Sonar needs the full Git history
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      # Run unit tests + generate JaCoCo reports first (Sonar needs them)
      - name: Run Unit Tests & Generate JaCoCo Reports
        run: |
          set -o pipefail
          ./gradlew jacocoIntegratedTestReport --no-build-cache

      - name: SonarQube Scan
        run: ./gradlew sonar --info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
