name: PR Checks

on:
  pull_request:
    branches:
      - develop

jobs:
  ktlint:
    name: KtLint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run ktlint
        id: ktlint
        run: ./gradlew ktlintCheck --build-cache
        continue-on-error: true

      - name: Upload ktlint reports
        if: steps.ktlint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/**'
          retention-days: 7

      - name: Comment PR on ktlint failure
        if: steps.ktlint.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ktlint-failure -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## ❌ KtLint Failed',
              '',
              'A task `ktlintCheck` falhou. Corrija os problemas de formatação antes de fazer merge.',
              '',
              `**[📎 Ver detalhes da execução](${runUrl})**`,
              '',
              'Para corrigir localmente:',
              '```',
              './gradlew ktlintFormat',
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail build on ktlint violations
        if: steps.ktlint.outcome == 'failure'
        run: exit 1

  detekt:
    name: Detekt
    needs: ktlint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run detekt
        id: detekt
        run: ./gradlew detekt --build-cache
        continue-on-error: true

      - name: Upload detekt reports
        if: steps.detekt.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/**'
          retention-days: 7

      - name: Comment PR on detekt failure
        if: steps.detekt.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- detekt-failure -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## ❌ Detekt Failed',
              '',
              'A task `detekt` falhou. Corrija as violações de código antes de fazer merge.',
              '',
              `**[📎 Ver detalhes da execução](${runUrl})**`,
              '',
              'Para verificar localmente:',
              '```',
              './gradlew detekt',
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail build on detekt violations
        if: steps.detekt.outcome == 'failure'
        run: exit 1

  build:
    name: Build
    needs: detekt
    runs-on: ubuntu-latest
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: true
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew assembleDebug --build-cache

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Run Unit Tests & Generate JaCoCo Reports
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew jacocoIntegratedTestReport --build-cache 2>&1 | tee unit_test_output.txt
        continue-on-error: true

      - name: Upload JaCoCo reports (para o job Sonar)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/build/reports/coverage/jacoco/**/*.xml'
          retention-days: 1

      - name: Upload unit test results (para o job Sonar)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/TEST-*.xml'
          retention-days: 1

      - name: Upload unit test reports
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

      - name: Comment PR on unit test failure
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- unit-test-failure -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let errorSummary = '';
            try {
              const output = fs.readFileSync('unit_test_output.txt', 'utf8');
              const lines = output.split('\n');
              const failureLines = lines.filter(l =>
                l.includes('FAILED') ||
                l.includes('> What went wrong') ||
                l.includes('Execution failed') ||
                l.match(/\d+ test(s)? .*failed/)
              ).slice(0, 20);
              if (failureLines.length > 0) {
                errorSummary = '\n\n```\n' + failureLines.join('\n').trim() + '\n```';
              }
            } catch (e) {}

            const body = [
              marker,
              '## ❌ Unit Tests Failed',
              '',
              `Foram encontradas falhas nos testes unitários.${errorSummary}`,
              '',
              `**[📎 Download test reports](${runUrl})**`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail build on unit test failures
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1

  screenshot-tests:
    name: Screenshot Tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Validate Screenshot Tests
        id: screenshot_validation
        run: ./gradlew validateDebugScreenshotTest --build-cache
        continue-on-error: true

      - name: Upload screenshot diffs
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: '**/build/reports/screenshotTest/**'
          retention-days: 7

      - name: Comment PR on screenshot failure
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- screenshot-failure -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## ❌ Screenshot Tests Failed',
              '',
              'As screenshots divergem das referências salvas. Baixe os diffs para visualizar as diferenças:',
              '',
              `**[📎 Download screenshot diffs](${runUrl})**`,
              '',
              'Para atualizar as referências localmente:',
              '```',
              './gradlew updateDebugScreenshotTest',
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail build on screenshot changes
        if: steps.screenshot_validation.outcome == 'failure'
        run: exit 1

  sonar:
    name: SonarQube Analysis
    # Roda após unit-tests (JaCoCo pronto) e screenshot-tests — ambos devem passar
    needs: [ unit-tests, screenshot-tests ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
      GRADLE_CACHE_PASS: ${{ secrets.GRADLE_CACHE_PASS }}
      GRADLE_CACHE_PUSH: false
    steps:
      # fetch-depth: 0 obrigatório — o Sonar precisa do histórico Git completo
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 19
        uses: actions/setup-java@v5
        with:
          java-version: '19'
          distribution: 'temurin'

      # Baixa os relatórios JaCoCo gerados pelo job unit-tests
      - name: Download JaCoCo reports
        uses: actions/download-artifact@v8
        with:
          name: jacoco-reports
          path: .

      # Baixa os resultados dos testes unitários
      - name: Download unit test results
        uses: actions/download-artifact@v8
        with:
          name: unit-test-results
          path: .

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
