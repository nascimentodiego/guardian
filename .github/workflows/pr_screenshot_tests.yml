name: Screenshot Tests

on:
  pull_request:
    branches:
      - develop

jobs:
  screenshot-tests:
    name: Screenshot Tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ runner.os }}-${{ hashFiles('**/*.png') }}
          restore-keys: lfs-${{ runner.os }}-

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup JDK 19
        uses: actions/setup-java@v4
        with:
          java-version: '19'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Decode google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Validate Screenshot Tests
        id: screenshot_validation
        run: ./gradlew validateDebugScreenshotTest
        continue-on-error: true

      - name: Upload screenshot diffs
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/reports/screenshotTest/**'
          retention-days: 7

      - name: Comment PR on screenshot failure
        if: steps.screenshot_validation.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- screenshot-failure -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## ❌ Screenshot Tests Failed',
              '',
              'As screenshots divergem das referências salvas. Baixe os diffs para visualizar as diferenças:',
              '',
              `**[📎 Download screenshot diffs](${runUrl})**`,
              '',
              'Para atualizar as referências localmente:',
              '```',
              './gradlew updateDebugScreenshotTest',
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail build on screenshot changes
        if: steps.screenshot_validation.outcome == 'failure'
        run: exit 1
